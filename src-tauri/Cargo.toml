[package]
name = "aeroplayer"
version = "0.1.0"
description = "AeroPlayer Desktop Media Player"
authors = ["Dinuwa"]
edition = "2026"

[lib]
name = "aeroplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
